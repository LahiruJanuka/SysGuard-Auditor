# SysGuard Auditor configuration
# -----------------------------------------------------------------
# This file is SOURCED by auditor.sh, so it must be valid shell
# syntax. Values here override the built-in defaults in the script.
#
# All values are integers in percent (0-100).
# WARN fires at or above *_WARN. CRIT fires at or above *_CRIT.
# CRIT must be >= WARN, or the run can never report WARN.
#
# To keep local settings out of version control, create a copy
# (e.g. config/local.conf), put it in .gitignore, and run:
#     CONFIG_FILE=config/local.conf ./auditor.sh
# -----------------------------------------------------------------

CPU_WARN=70
CPU_CRIT=85

MEM_WARN=75
MEM_CRIT=90

DISK_WARN=80
DISK_CRIT=90
